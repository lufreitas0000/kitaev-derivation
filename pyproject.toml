[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitaev-derivation"
version = "0.1.0"
description = "Exact symbolic Schrieffer-Wolff projector CAS and two-site Fock-space oracle for Kitaev materials"
authors = [
    { name = "Lu Freitas" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "sympy>=1.13",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP", "C4"]
ignore = ["E501", "N802", "N803", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "tests", "scripts"]
